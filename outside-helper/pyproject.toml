[project]
name = "outside-helper"
dynamic = ["version"]
description = "The person's outside helper: drives their Chrome to fetch pages for the AI workspace's 請幫我查 card (docs/plan-outside-helper.md)."
requires-python = ">=3.10"
# Pinned exactly by the pack script (scripts/pack_outside_helper.py) for the
# wheelhouse users install; this range is what the code supports.
dependencies = ["playwright>=1.49"]

[project.scripts]
outside-helper = "outside_helper.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/outside_helper/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/outside_helper"]
# Generated (gitignored) — hatch skips ignored files unless named here.
artifacts = ["src/outside_helper/page_to_markdown.js"]
