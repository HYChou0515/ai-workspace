[project]
name = "aiws-facet-cache"
version = "0.1.0"
description = "The chart plugin's facet cache: a per-group, fixed-record binary file a gallery pages out of."
requires-python = ">=3.10"
# Standard library only, on purpose: the pager reads this format on every scroll
# and must not pay a pandas import (plan-view-plugins-pr4 P4).
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiws_facet_cache"]

[dependency-groups]
dev = ["pytest>=8"]

# Self-contained rootdir so `pytest` doesn't walk up into the parent repo's config.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
