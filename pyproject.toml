[project]
name = "workspace-app"
version = "2026.7.23"
description = "Workspace management app with pluggable sandbox + agent runtime"
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.9.0",
    # Signs and checks the size-limit certificates in tooling/grant.py. It was
    # already here by way of other packages; declared now because we import it.
    "cryptography>=44",
    "docker>=7.1.0",
    "docx2txt>=0.9",
    "ipykernel>=7.2.0",
    "json-repair>=0.60.1",
    "jupyter-client>=8.8.0",
    "litellm>=1.85.1",
    "llama-index-core>=0.10,<0.11",
    "llama-index-readers-file>=0.1.33",
    # Renders an assistant answer for the chat-video player. Already here by
    # way of rich (litellm); declared now because we import it.
    "markdown-it-py>=3",
    "openai-agents>=0.17.3",
    "openpyxl>=3.1.5",
    "pypdfium2>=5.9.0",
    "pyyaml>=6.0.3",
    "specstar[magic]==0.13.0a2",
    "tenacity>=8.5.0",
    "tree-sitter<0.22",
    "tree-sitter-languages>=1.10.2",
]

[project.optional-dependencies]
process-sandbox = [
    "matplotlib>=3.10.9",
    "numpy>=1.26.4",
    "pandas<3",
    "pandera>=0.31.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]
# The cross-pod event bus's RabbitMQ backend (event_bus.kind: rabbitmq). Async
# AMQP client — only needed on a multipod deploy that fans live SSE events over
# the broker; the in-memory default needs nothing.
rabbitmq = [
    "aio-pika>=9.4.0",
]
# Rendering a chat transcript to video (`workspace_app.chat_video`,
# docs/plan-chat-video.md): a headless Chromium records the player page. Only
# the pod that renders needs it — the timeline and the page import without it.
# After `uv sync --extra chat-video`, run `playwright install chromium` once;
# ffmpeg comes from the OS. Pinned to 1.49 because of the BROWSER download,
# not the wheel: with 1.63 installed, `playwright install` refuses Debian 11
# ("does not support … on debian11-x64"), which is what the dev boxes run —
# raise it when the image base moves. The pin also holds greenlet at 3.1.x
# for the whole lock (playwright's own hard pin); nothing at runtime uses
# greenlet today.
chat-video = [
    "playwright>=1.49,<1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty",
    "coverage>=7",
    "asgi-lifespan>=2.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3",
]
# Documentation site (mkdocs + Material). Build: `uv run --group docs mkdocs build`;
# serve locally: `uv run --group docs mkdocs serve`. Not needed by the app or the CI gate.
docs = [
    "mkdocs-material>=9.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hang is the one failure CI cannot report: a wedged test held the `api-4`
# shard open for hours, twice, with no log until the job was cancelled and no
# test name even then (2 workers, a dot per test). The bound turns it into a
# named failure. Wide on purpose — the slowest legitimate unit test on a 2-core
# runner under coverage is well under it — and per test, so a slow shard is
# never cut short. The default method (a signal, raised inside the test with
# the stack of where it sat) is what names the spot; the plugin falls back to
# its thread method by itself where a signal cannot be delivered.
timeout = 600
markers = [
    "integration: requires real docker / subprocess sandbox / jupyter kernel / uv / ollama; excluded from default CI via -m 'not integration'",
]

[tool.coverage.run]
branch = true
source = ["src/workspace_app"]
omit = [
    "src/workspace_app/__main__.py",
    "src/workspace_app/workflow/__main__.py",
    "src/workspace_app/worker/__main__.py",  # #312: settings-driven composition + CLI glue
    "src/workspace_app/changelog/__main__.py",  # #441: git-log walk + file IO glue
    "src/workspace_app/skill_eval/__main__.py",  # CLI glue + litellm IO; the library is unit-tested
    "src/workspace_app/chat_video/__main__.py",  # two lines of `raise SystemExit(main())`; cli.py is tested
]
# parallel + sitecustomize's process_startup() let each pytest-xdist worker
# subprocess record its own .coverage.* file; `coverage combine` merges them.
# Harmless for serial runs (one data file, still combined).
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# sample-tools/* are standalone example projects (own pyproject + venv); they're
# linted/typed on their own, not as part of this package. sandbox-host/ is a
# fully independent project (own pyproject + uv.lock + CI job) — see #251.
# tool-starter/ is handed to external authors as a repository of their own
# (#674): it must stand alone, so it is neither built nor typed with ours.
# view-plugins/*/sandbox-src are plugin sandbox halves, each its own project
# with its own CI job, like sandbox-host.
extend-exclude = ["sample-tools", "sandbox-host", "tool-starter", "view-plugins"]

[tool.ruff.lint]
# TC004: an import parked under `TYPE_CHECKING` that is used at runtime. `ty`
# and F821 both read it as a binding, so nothing else sees it — and one of
# these made every off-hours round die on `NameError` before it sent anything.
# Project-wide it flags exactly that one line, so it costs no noise.
select = ["E", "F", "I", "B", "UP", "SIM", "TC004"]

[tool.ty.src]
exclude = [
    "src/workspace_app/rca/templates/*/**",
    "sample-tools/**",
    "sandbox-host/**",
    "tool-starter/**",
    "view-plugins/**",
]
