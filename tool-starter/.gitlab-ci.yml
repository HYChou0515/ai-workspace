# Copy this into your tool repository as `.gitlab-ci.yml`.
#
# It runs one job inside the builder image and publishes two files. Everything
# the platform needs is in those two files; nothing else about your repository
# is read.
#
# See docs/tool-authoring.md for the full contract.

build-tool:
  # Build inside the image the platform's sandboxes actually run, or the
  # bundle's native wheels will not load there. The platform refuses an
  # artifact built anywhere else rather than let it fail in front of a user.
  image: registry.example/ai-workspace/tool-builder:2026.07

  script:
    # Runs the build AND a smoke test of the result. A tool that does not
    # start leaves no artifact behind, so a red build can never be published.
    - build-tool "$CI_PROJECT_DIR" dist

  artifacts:
    paths:
      - dist/
    # REQUIRED. GitLab expires artifacts after ~30 days by default; once the
    # URL 404s, machines that already cached your tool keep limping along on
    # the last copy while every NEW machine gets nothing. It presents as "it
    # worked yesterday" and is miserable to diagnose.
    expire_in: never

  rules:
    # Publish from the default branch only: the URL the platform holds points
    # at "the latest artifact of this ref", so a feature branch building over
    # it would ship work in progress to everyone.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The second artifact (#674): the same tool, packaged as an MCP server.
#
# The platform keeps getting the bundle from this pipeline — that is unchanged
# and remains the only way it runs your tool. This job additionally publishes an
# image, so any engineer with docker can point their own agent (Claude Code,
# opencode, codex) at the same tool.
#
# Built FROM the bundle the previous job produced, never rebuilt: two builds of
# the same source can differ, and then "it works in my editor" would stop
# meaning anything about the platform.
package-mcp:
  needs: [build-tool]
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # The platform team gives you this, the same one `build-tool` uses.
    MCP_IMAGE: $CI_REGISTRY_IMAGE/mcp:$CI_COMMIT_REF_SLUG
  script:
    - mkdir -p bundle && tar xzf dist/tool.tar.gz -C bundle
    # The recipe comes out of the build, so it always matches the bundle and
    # you never have to edit it.
    - docker build --build-arg BUILDER_IMAGE="$TOOL_BUILDER_IMAGE" -f dist/mcp.Dockerfile -t "$MCP_IMAGE" .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$MCP_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
