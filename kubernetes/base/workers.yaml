---
# ── blob-GC reconcile (#245; one pass per `filestore.gc_interval_sec` window) ──
# Fixed 1 replica, no HPA: the API's sweeper asks ONCE per window behind a
# ScanLease and the coordinator coalesces overlapping asks, so one consumer is
# the whole load. This worker boots the API's OWN composition (`build_app`,
# never served) rather than the slim worker bundle: specstar's reconcile builds
# the live blob set from the REGISTERED models, and a consumer holding fewer
# than the API would quarantine, then delete, every blob the missing models
# reference — the runner refuses such a pass (the job reads FAILED, the log
# names the missing models), and equal registries are what makes it run.
#
# Because it boots the API's composition, this pod needs what the API pod
# needs AT BOOT — the same configmap, and the same mounts and privileges the
# construction step touches: `discover_packages` reads the prebuilt tools dir
# (WORKSPACE_TOOLS_DIR / the image's bundles — an absent dir fails loud);
# `LocalProcessSandbox` mkdirs SANDBOX_ROOT (hence `scratch` below, so it does
# not land on the container layer); `sandbox.isolation.enabled: true` needs the
# CAP_SETUID/SETGID + cgroup grant `deployment.yaml` documents, on this pod too;
# an `nfs_tree` durable store needs `/mnt/workspaces` here for the ws_census
# figure to be real (an absent tree reads as zeros). Mirror whatever the
# overlay adds to `rca-app` for those. It serves nothing and starts none of the
# sweepers; the #219 inline→Binary migration it runs at boot is idempotent.
#
# Memory is the sizing that matters: for each blob-capable model the pass
# holds EVERY ResourceMeta at once — indexed_data included, which on doc-chunk
# / cluster-member is every row's embedding vectors (the Postgres meta store
# decodes the full-meta BYTEA; the §6 vector strip only thins the JSONB column,
# so `migrate/execute` does not reduce this) — and streams the revisions one
# resource at a time. That is what killed the API pod that used to run it (its
# last line: `blob-gc: won lease`). An OOM here is the same fact on a pod no
# request depends on: raise the limit. A shorter window does not help — every
# pass reads every meta there is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-worker-blob-gc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-worker-blob-gc
  template:
    metadata:
      labels:
        app: rca-worker-blob-gc
    spec:
      terminationGracePeriodSeconds: 120 # let a pass in flight finish its deletes
      containers:
        - name: worker
          image: rca-app:latest
          command: ["python", "-m", "workspace_app.worker", "blob-gc"]
          envFrom:
            - configMapRef:
                name: rca-config
          volumeMounts:
            - name: data
              mountPath: /data
            # The API's scratch volume (SANDBOX_ROOT): the sandbox layer this
            # composition builds mkdirs it at boot. Never written to by a pass.
            - name: scratch
              mountPath: /scratch
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rca-data
        - name: scratch
          persistentVolumeClaim:
            claimName: rca-scratch
---
# ── chat-video render (plan-chat-video-export) — fixed 1 replica, no HPA ──────
# One job = one headless Chromium recording the transcript replay in real time
# (a 41-second video takes 41 seconds to record) and one ffmpeg encode. The
# image is NOT `rca-app`: Chromium + ffmpeg add 1.63 GB (measured, #834) the
# API pod has no use for, so `docker/Dockerfile`'s `chat-video` stage builds
# `rca-app-chat-video` — the same app, plus the two tools; build it with
# `--target chat-video` (a bare build is the API image).
#
# Like blob-gc, this worker boots the API's OWN composition (`build_app`, never
# served): the job reads its transcript and writes its video through the API's
# `WorkspaceFiles` — the quota, the jail and the mirror — and only `create_app`
# composes that facade. So it needs what the API pod needs AT BOOT: the same
# configmap, `/data` for the durable store, `/scratch` for the sandbox root the
# construction step mkdirs (the video is written through the facade into the
# item's shared dir on THIS volume when the item is warm on some pod, else into
# the durable snapshot). Mirror whatever the overlay adds to `rca-app` for those.
#
# Memory, measured on the 41-second 1080p sample (`docs/chat-video.md`): the
# recording holds Chromium (154–172 MB) + Playwright's recorder ffmpeg (147 MB);
# the encode that follows it peaks at 273–320 MB for mp4 and 230–640 MB for gif
# (two-pass, a frame queue that sometimes fills) — the two never overlap. The
# limit leaves room for the process itself; an OOM here fails one job's
# progress file, not a request. `chat_video.max_pixels` / `max_seconds` in the
# configmap are what bound this, so raise them together with the limit.
# Scratch disk holds the recording (4.6 MB for the sample, 12 MB for 120 s) and
# the outputs (≤ `chat_video.max_output_bytes`, 100 MB by default) per job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-worker-chat-video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-worker-chat-video
  template:
    metadata:
      labels:
        app: rca-worker-chat-video
    spec:
      # A SIGTERM lets the job in flight finish (`consume_until_stopped`
      # drains), and a job's worst case is the sum of its own deadlines:
      # the recording gives up at `expected × 1.5 + 30 s` (`render.record`),
      # 300 s for the default `chat_video.max_seconds` of 180; each ffmpeg
      # pass at `_ENCODE_TIMEOUT_S` = 300 s, and gif is two passes — 300 +
      # 600 = 900. That is one job's floor: the drain also waits for the
      # BACKLOG (`aclose` waits for no PENDING/PROCESSING rows, consuming
      # meanwhile), so a backlog that outlasts the grace ends in a SIGKILL
      # mid-render. Then: the broker redelivers (specstar ACKs after the
      # handler) but holds the message while its own row is still
      # PROCESSING (the partition-busy check), until specstar's stale sweep
      # (every 60 s, 15 s without its heartbeat) marks the row; the next
      # worker then re-renders it from the start (same token, `mine()`
      # agrees) — up to `max_retries` (3), after which the row is FAILED and
      # the progress file stays `rendering` until someone deletes it or a
      # new request replaces it. The pill says "worker 沒有回應" meanwhile;
      # with no worker consuming at all, for as long as that lasts.
      terminationGracePeriodSeconds: 900
      containers:
        - name: worker
          image: rca-app-chat-video:latest
          command: ["python", "-m", "workspace_app.worker", "chat-video"]
          envFrom:
            - configMapRef:
                name: rca-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /scratch
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rca-data
        - name: scratch
          persistentVolumeClaim:
            claimName: rca-scratch
