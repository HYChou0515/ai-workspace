          envFrom:
            - configMapRef:
                name: rca-config
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rca-data
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rca-worker-wiki
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rca-worker-wiki
  minReplicas: 1
  maxReplicas: 4
  # NOTE: wiki/card-gen are IO-bound (waiting on the LLM), so CPU utilisation
  # under-reports load — tune min/maxReplicas to your throughput rather than
  # relying on the CPU target alone (#312; KEDA queue-depth scaling out of scope).
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
