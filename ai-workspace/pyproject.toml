[project]
name = "ai-workspace"
dynamic = ["version"]
description = "The person's helper: drives their Chrome to fetch pages for the AI workspace's 請幫我查 card (docs/plan-outside-helper.md)."
requires-python = ">=3.10"
# Pinned exactly by the pack script (scripts/pack_ai_workspace.py) for the
# wheelhouse users install; this range is what the code supports.
dependencies = ["playwright>=1.49"]

[project.scripts]
ai-workspace = "ai_workspace.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ai_workspace/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workspace"]
# Generated (gitignored) — hatch skips ignored files unless named here.
artifacts = ["src/ai_workspace/page_to_markdown.js"]
