[project]
name = "sandbox-host"
version = "0.1.0"
description = "Standalone HTTP sandbox host — isolated process execution for the workspace agent"
requires-python = ">=3.12"
# Deliberately minimal — the host is a security-sensitive root service and
# shares NO dependencies with workspace-app (no litellm / llama-index / specstar
# / data-science stack). Just an HTTP shell over an isolated-process backend.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2",
    # #674: the host verifies the certificate that admits a third-party tool,
    # on every resolve. It is the only thing that can — pasting a URL into an
    # app is not approval, and a manifest can claim any name for itself.
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_host"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty",
    "coverage>=7",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real subprocess sandbox / root / cgroup v2; excluded from default CI via -m 'not integration'",
]

[tool.coverage.run]
branch = true
source = ["src/sandbox_host"]
omit = ["src/sandbox_host/__main__.py"]  # serve glue (uvicorn)

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# ⚠️ This package is EXCLUDED by the repo-root config, and with no `[tool.ty*]`
# table of its OWN, `ty` walked up to that one and checked NOTHING — "WARN No
# python files found under the given path(s)" followed by "All checks passed!".
# CI ran a green gate over zero files, which hid a `TypeError` in `POST
# /sandboxes` (an override that kept the old signature) that would have stopped
# this service creating any sandbox at all.
#
# What stops the walk-up is HAVING a table here, any table — measured: deleting
# `[tool.ty.src]` below still checks every file, deleting `[tool.ty.rules]`
# still checks every file (and reports the 53 debt diagnostics). An earlier
# version of this comment credited `exclude = []` for it, which is why it is
# now stated as something that was run rather than something that was reasoned.
[tool.ty.src]
exclude = []

[tool.ty.rules]
# ⚠️ DEBT, declared rather than hidden: turning the gate on surfaced 58
# pre-existing diagnostics, 51 of them this one — overwhelmingly test doubles
# passed where a real protocol type is expected, which the app side handles with
# per-line `# ty: ignore[invalid-argument-type]`. Cleaning those is a separate
# job from #775 and would bury this PR.
invalid-argument-type = "ignore"

# …but the debt is ENTIRELY in `tests`, so demoting it package-wide made the
# gate green over a whole class of real defect in `src` — measured: with the
# rule at `error`, `src` reports zero and `tests` reports all 51, and a
# genuinely wrong-type call injected into `src/sandbox_host/local_process.py`
# passed as shipped. That is the same "green over nothing" this section exists
# to fix, narrowed rather than removed. So the demotion is scoped to where the
# debt actually is.
[[tool.ty.overrides]]
include = ["src/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "error"
