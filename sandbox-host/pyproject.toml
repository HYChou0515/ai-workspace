[project]
name = "sandbox-host"
version = "0.1.0"
description = "Standalone HTTP sandbox host — isolated process execution for the workspace agent"
requires-python = ">=3.12"
# Deliberately minimal — the host is a security-sensitive root service and
# shares NO dependencies with workspace-app (no litellm / llama-index / specstar
# / data-science stack). Just an HTTP shell over an isolated-process backend.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2",
    # #674: the host verifies the certificate that admits a third-party tool,
    # on every resolve. It is the only thing that can — pasting a URL into an
    # app is not approval, and a manifest can claim any name for itself.
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_host"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty",
    "coverage>=7",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real subprocess sandbox / root / cgroup v2; excluded from default CI via -m 'not integration'",
]

[tool.coverage.run]
branch = true
source = ["src/sandbox_host"]
omit = ["src/sandbox_host/__main__.py"]  # serve glue (uvicorn)

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ty.src]
# This package is EXCLUDED by the repo-root config, and with no section of its
# own `ty` walked up to that one and checked NOTHING — "WARN No python files
# found under the given path(s)" followed by "All checks passed!". CI has been
# running a green gate over zero files. It hid a `TypeError` in `POST
# /sandboxes` (an override that kept the old signature) that would have stopped
# this service creating any sandbox at all.
exclude = []

[tool.ty.rules]
# ⚠️ DEBT, declared rather than hidden: turning the gate on surfaced 58
# pre-existing diagnostics, 51 of them this one — overwhelmingly test doubles
# passed where a real protocol type is expected, which the app side handles with
# per-line `# ty: ignore[invalid-argument-type]`. Cleaning those is a separate
# job from #775 and would bury this PR. Demoted so the gate is REAL for the
# classes that actually bite (an override whose signature drifted from its base
# is exactly what shipped broken), instead of staying green over nothing.
invalid-argument-type = "ignore"
