[project]
name = "job-contract"
version = "0.1.0"
description = "The job tool contract: the interface a backend implements, and the values it declares once."
requires-python = ">=3.12"
# Nothing. The backend and the tool shell both depend on this package, so
# anything it pulled in would be forced on every backend author too.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_contract"]

[dependency-groups]
dev = ["pytest>=8"]

# Self-contained rootdir so `pytest` doesn't walk up into the parent repo's config.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
