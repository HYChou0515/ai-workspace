name: CI

# Full test gate for GitHub (the .gitlab-ci.yml is a dead placeholder).
# Mirrors the backend + frontend `test` checks; build/deploy are GitLab/k8s
# specific and intentionally NOT ported. Coverage is uploaded to Codecov under
# per-language flags so the README badges read independently.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Lint / format / type — split out of the test matrix so it runs ONCE, not
  # once per shard. It's fast (seconds), so it never gates wall-clock time.
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libmagic is needed by the tabular/magic-sniff parser path.
      - name: Install libmagic
        run: |
          # GitHub runners preload a Microsoft (azure-cli) apt repo whose mirror
          # intermittently serves an invalid InRelease, so `apt-get update` exits
          # 100 — even though the BASE Ubuntu repos (where libmagic1 lives) update
          # fine. Tolerate that non-zero (the base index is still refreshed), then
          # install; a genuine install failure still fails the step loudly.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # --all-extras pulls the process-sandbox extra (pandera/scipy/sklearn/seaborn);
      # a bare sync leaves test_infer_modules failing.
      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      # ty is run unscoped (CI checks tests/ too — a file-scoped run once missed a
      # test-helper type error).
      - name: Type check
        run: uv run ty check

  # The unit suite is SHARDED across parallel runners. On one runner the backend
  # pytest step was ~75 min (it dwarfs frontend ~4 min / sandbox-host ~1 min), so
  # the whole CI wall clock was that one step. Each shard runs a slice.
  #
  # Two shard flavours:
  #   * `paths`      — an explicit set of dirs/args handed to pytest.
  #   * `split_paths` — targets whose COLLECTED TESTS are round-robined across
  #     `split_total` runners (this test's slice = collection position % total).
  #
  # The split unit is the TEST, not the test FILE (#CI-balance). File-level
  # round-robin balanced file COUNT while cost varies by an order of magnitude
  # BETWEEN files, so the three heaviest files (test_kb_api / test_litellm_runner
  # / test_registry) could all land in one slice: measured 47.7 min on api-1 while
  # api-2 ran 34.1, then — after a branch added a few test files, which shifts
  # every later file's position and reshuffles the WHOLE assignment — 50.9 min on
  # api-2 while api-1 ran 23.4. Which shard blew up was effectively random per
  # commit. Slicing collected tests instead gives every shard 1/N of EVERY file,
  # so between-file cost differences cancel by construction rather than by luck.
  # This is only free because tests/api has NO module/session-scoped fixtures —
  # splitting a file across shards duplicates no setup. Check that before
  # split_paths-ing a new dir.
  #
  # The `rest` shard runs EVERYTHING the named shards don't cover — via --ignore,
  # NOT an allowlist — so a newly added test dir is never silently dropped from CI;
  # likewise a new test in a split dir just appears in the collection and lands in
  # some slice, never dropped. Coverage is uploaded per shard under the same
  # `backend` flag; Codecov merges the shards' partial reports for the badge.
  backend-test:
    name: backend-test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # tests/api is ~110 runner-min of unit tests; 5 slices puts each shard
          # at ~22 min, which is where workflow-agent-apps (~23 min) takes over as
          # the critical path — more slices would not shorten the run. Setup is
          # 0.3 min of a shard, so an extra runner is nearly free.
          - name: api-1
            split_paths: tests/api
            split_index: "0"
            split_total: "5"
          - name: api-2
            split_paths: tests/api
            split_index: "1"
            split_total: "5"
          - name: api-3
            split_paths: tests/api
            split_index: "2"
            split_total: "5"
          - name: api-4
            split_paths: tests/api
            split_index: "3"
            split_total: "5"
          - name: api-5
            split_paths: tests/api
            split_index: "4"
            split_total: "5"
          - name: kb
            paths: tests/kb
          - name: workflow-agent-apps
            paths: tests/workflow tests/agent tests/apps
          - name: rest
            paths: >-
              --ignore=tests/api --ignore=tests/kb --ignore=tests/workflow
              --ignore=tests/agent --ignore=tests/apps tests
    steps:
      - uses: actions/checkout@v4

      # libmagic is needed by the tabular/magic-sniff parser path.
      - name: Install libmagic
        run: |
          # GitHub runners preload a Microsoft (azure-cli) apt repo whose mirror
          # intermittently serves an invalid InRelease, so `apt-get update` exits
          # 100 — even though the BASE Ubuntu repos (where libmagic1 lives) update
          # fine. Tolerate that non-zero (the base index is still refreshed), then
          # install; a genuine install failure still fails the step loudly.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # --all-extras pulls the process-sandbox extra (pandera/scipy/sklearn/seaborn);
      # a bare sync leaves test_infer_modules failing.
      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      # CI runs UNIT tests only (`-m "not integration"`), parallelised with xdist.
      # Integration tests (real docker / subprocess sandbox / jupyter kernel / uv)
      # are excluded — on a CI runner they fill the disk and take ~90 min.
      # COVERAGE_PROCESS_START + PYTHONPATH let sitecustomize start coverage in
      # each xdist worker subprocess; `coverage combine` merges them. The
      # authoritative 100% gate is the FULL local suite (see CLAUDE.md); CI's
      # coverage is the lower unit-only number and is per-shard PARTIAL here —
      # uploaded to Codecov under one flag, which merges the shards. NOT gated.
      - name: Tests + coverage (unit only, parallel)
        env:
          COVERAGE_PROCESS_START: pyproject.toml
          PYTHONPATH: .
        run: |
          set -o pipefail
          # A shard either names explicit paths, or round-robin-slices its
          # targets' COLLECTED TESTS across N runners (this slice = collection
          # position % N). Slicing tests rather than files is what keeps the
          # shards balanced — see the matrix comment above. Every collected test
          # lands in exactly one slice, so a newly added test is auto-distributed
          # and never dropped.
          if [ -n "${{ matrix.split_paths }}" ]; then
            # Collect first (~15 s for tests/api). A collection error must fail
            # the job here rather than silently yield a short id list, so the
            # exit status is checked before the ids are used.
            collected="$RUNNER_TEMP/collected.txt"
            slice="$RUNNER_TEMP/slice.txt"
            uv run pytest -m "not integration" --collect-only -q \
              ${{ matrix.split_paths }} > "$collected"
            # Anchored to a real node id (`path.py::…`) so a warning line that
            # happens to contain '::' can never be handed to pytest as a target.
            # `|| true`: the step runs under `bash -e` + pipefail, and grep
            # exits 1 on no-match — which would kill the step before the empty
            # -slice check below could say WHY. A real grep failure also lands
            # on that check, since it too leaves the slice empty.
            grep -E '^[^ ]+\.py::' "$collected" \
              | awk "NR % ${{ matrix.split_total }} == ${{ matrix.split_index }}" \
              > "$slice" || true
            # An empty slice would leave pytest with no positional args, and it
            # would then run `testpaths` — the WHOLE suite — on every shard.
            if [ ! -s "$slice" ]; then
              echo "::error::slice ${{ matrix.split_index }}/${{ matrix.split_total }} of '${{ matrix.split_paths }}' collected 0 tests"
              exit 1
            fi
            echo "shard ${{ matrix.name }}: $(wc -l < "$slice") of $(grep -cE '^[^ ]+\.py::' "$collected") collected tests"
            # mapfile + array expansion, not word splitting: a parametrised test
            # id may contain spaces.
            mapfile -t ids < "$slice"
            uv run pytest -m "not integration" -n auto "${ids[@]}"
          else
            uv run pytest -m "not integration" -n auto ${{ matrix.paths }}
          fi
          uv run coverage combine
          uv run coverage report
          uv run coverage xml

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          # Codecov never blocks the build; the authoritative 100% gate is the
          # full local suite (CLAUDE.md), not CI.
          fail_ci_if_error: false

  sandbox-host-test:
    # The sandbox host is a fully independent project (own pyproject + uv.lock,
    # no workspace-app deps) — #251. It gets its own lean CI: lint + type + unit
    # tests. Integration tests (real subprocess / root / cgroup v2) are excluded
    # here, same as the backend job; the 100% gate is the full local suite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check src tests

      - name: Tests (unit only)
        run: |
          uv run coverage run -m pytest -m "not integration"
          uv run coverage report

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Tests + coverage
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm run build

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # `uses:` actions run at repo root regardless of job working-directory.
          files: web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
